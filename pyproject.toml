[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onesauce-companion"
description = "Companion application for installing and managing OnesaUCE content"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "internetarchive>=5.8",
    "PySide6>=6.7",
    "requests>=2.32",
    "keyring>=25.6",
]

[project.scripts]
onesauce-companion = "onesauce_companion.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "onesauce_companion.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onesauce_companion = ["VERSION", "data/*.json.gz"]

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
# Default pyflakes/pycodestyle-error rules; expand once the backlog refactors land.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = [
    "src/onesauce_companion/models.py",
    "src/onesauce_companion/manifest.py",
    "src/onesauce_companion/services",
]
ignore_missing_imports = true
check_untyped_defs = true
