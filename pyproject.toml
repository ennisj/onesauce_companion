[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onesauce-companion"
version = "0.1.0"
description = "Companion application for installing and managing OnesaUCE content"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "internetarchive>=5.8",
    "PySide6>=6.7",
    "requests>=2.32",
]

[project.scripts]
onesauce-companion = "onesauce_companion.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onesauce_companion = ["data/*.json.gz"]
